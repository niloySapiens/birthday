<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Identity Verification System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#07070d;
  --bg-1:#0d0c17;
  --bg-2:#151129;
  --violet:#6c5ce7;
  --violet-2:#8a63f2;
  --blue:#3b6fe0;
  --magenta:#c44fd6;
  --cream:#f7ecdc;
  --pink:#ffb6c9;
  --rose:#ff7aa2;
  --gold:#f4c04d;
  --burgundy:#3a0f1c;
  --ink:#f2eef9;
  --ink-dim:rgba(242,238,249,0.62);
  --line:rgba(255,255,255,0.12);
  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.09);
  --radius:20px;
  --serif:'DM Serif Display', Georgia, serif;
  --sans:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --accent:var(--violet-2);
  --accent-2:var(--blue);
  --t-bg-0:var(--bg-0);
  --t-bg-1:var(--bg-1);
  --t-bg-2:var(--bg-2);
  --warmth:0;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--t-bg-0);
  overscroll-behavior:none;
}

body{
  font-family:var(--sans);
  color:var(--ink);
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  transition:background 1.4s ease;
}

#bg-canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

#stage-bg{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(
      ellipse 80% 60% at 20% 0%,
      color-mix(in srgb, var(--accent) 32%, transparent),
      transparent 60%
    ),
    radial-gradient(
      ellipse 70% 55% at 85% 100%,
      color-mix(in srgb, var(--accent-2) 28%, transparent),
      transparent 60%
    ),
    linear-gradient(
      160deg,
      var(--t-bg-0),
      var(--t-bg-1) 55%,
      var(--t-bg-2)
    );
  transition:background 1.6s ease;
}

#grain{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:0.05;
  mix-blend-mode:overlay;
}

#app{
  position:relative;
  z-index:2;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

a,button{
  font-family:inherit;
}

button{
  cursor:pointer;
}

::selection{
  background:var(--accent);
  color:#fff;
}

/* focus */

button:focus-visible,
[tabindex]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
  border-radius:10px;
}

/* top chrome */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  padding-top:calc(18px + env(safe-area-inset-top));
  pointer-events:none;
}

.topbar > *{
  pointer-events:auto;
}

.brand{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--ink-dim);
  display:flex;
  align-items:center;
  gap:8px;
}

.brand .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
  animation:pulse-dot 1.8s ease-in-out infinite;
}

@keyframes pulse-dot{
  0%,100%{opacity:1}
  50%{opacity:0.35}
}

.progress-tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--ink-dim);
  border:1px solid var(--line);
  padding:6px 12px;
  border-radius:100px;
  background:var(--glass);
  backdrop-filter:blur(10px);
}

.progress-tag.glitching{
  color:#ff6b6b;
  border-color:rgba(255,107,107,0.4);
  animation:glitchshake 0.15s linear infinite;
}

@keyframes glitchshake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-1px)}
  75%{transform:translateX(1px)}
  100%{transform:translateX(0)}
}

.sound-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(10px);
  color:var(--ink);
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background 0.2s, transform 0.15s;
}

.sound-btn:hover{
  background:var(--glass-strong);
  transform:scale(1.06);
}

.sound-btn:active{
  transform:scale(0.94);
}

/* stage layout */

.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 20px 60px;
  min-height:100vh;
  min-height:100dvh;
  width:100%;
}

.stage-inner{
  width:100%;
  max-width:640px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.18em;
  color:color-mix(in srgb, var(--accent-2) 70%, white 20%);
  margin-bottom:14px;
  opacity:0.85;
}

.headline{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(28px, 6vw, 46px);
  line-height:1.12;
  margin:0 0 14px;
  letter-spacing:-0.01em;
}

.sub{
  font-size:15px;
  color:var(--ink-dim);
  line-height:1.6;
  max-width:460px;
  margin:0 auto 30px;
}

.scan-line-wrap{
  position:relative;
  width:100%;
  max-width:420px;
  height:2px;
  background:var(--line);
  border-radius:2px;
  margin:6px auto 36px;
  overflow:hidden;
}

.scan-line{
  position:absolute;
  top:0;
  left:-30%;
  width:30%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    var(--accent-2),
    var(--accent),
    transparent
  );
  animation:scan 2.2s linear infinite;
}

@keyframes scan{
  0%{left:-30%}
  100%{left:100%}
}

.card{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:var(--radius);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:34px 28px;
  width:100%;
  box-shadow:0 20px 60px -20px rgba(0,0,0,0.5);
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
  margin-top:6px;
}

.options.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media (max-width:480px){
  .options.grid2{
    grid-template-columns:1fr;
  }
}

.opt-btn{
  position:relative;
  padding:16px 20px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.04);
  color:var(--ink);
  font-size:15.5px;
  font-weight:600;
  text-align:left;
  transition:
    transform 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:10px;
}

.opt-btn:hover{
  background:rgba(255,255,255,0.09);
  border-color:color-mix(in srgb, var(--accent) 50%, var(--line));
  transform:translateY(-2px);
  box-shadow:0 8px 24px -10px color-mix(
    in srgb,
    var(--accent) 45%,
    transparent
  );
}

.opt-btn:active{
  transform:translateY(0px) scale(0.99);
}

.opt-btn:disabled{
  opacity:0.5;
  pointer-events:none;
}

.opt-btn .glow-ripple{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:radial-gradient(
    circle at var(--rx,50%) var(--ry,50%),
    color-mix(in srgb, var(--accent) 35%, transparent),
    transparent 60%
  );
  opacity:0;
  transition:opacity 0.3s;
}

.opt-btn:hover .glow-ripple{
  opacity:1;
}

.system-log{
  margin-top:22px;
  width:100%;
  text-align:left;
  font-family:var(--mono);
  font-size:12.5px;
  color:var(--ink-dim);
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:20px;
}

.system-log .line{
  opacity:0;
  transform:translateY(4px);
  animation:logline 0.4s ease forwards;
}

@keyframes logline{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.system-log .line b{
  color:var(--ink);
}

.system-log .line.warn{
  color:#ffb454;
}

.continue-btn{
  margin-top:26px;
  padding:14px 30px;
  border-radius:100px;
  border:1px solid color-mix(
    in srgb,
    var(--accent) 55%,
    var(--line)
  );
  background:linear-gradient(
    135deg,
    color-mix(in srgb, var(--accent) 85%, transparent),
    color-mix(in srgb, var(--accent-2) 85%, transparent)
  );
  color:#fff;
  font-weight:700;
  font-size:14.5px;
  letter-spacing:0.01em;
  opacity:0;
  transform:translateY(6px);
  animation:fadeup 0.5s ease forwards;
  box-shadow:0 10px 30px -10px color-mix(
    in srgb,
    var(--accent) 60%,
    transparent
  );
}

@keyframes fadeup{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.continue-btn:hover{
  filter:brightness(1.08);
}

.continue-btn:active{
  transform:translateY(1px) scale(0.98);
}

/* food grid */

.food-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  width:100%;
  margin-top:8px;
}

@media (min-width:520px){
  .food-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

.food-tile{
  border:1px solid var(--line);
  background:rgba(255,255,255,0.04);
  border-radius:16px;
  padding:20px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  transition:
    transform 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
  min-height:100px;
  justify-content:center;
  color:var(--ink);
  font-family:var(--sans);
}

.food-tile .emoji{
  font-size:30px;
  line-height:1;
}

.food-tile .label{
  font-size:14px;
  color:var(--ink);
  font-weight:700;
}

.food-tile:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,0.09);
  border-color:color-mix(
    in srgb,
    var(--accent) 50%,
    var(--line)
  );
}

.food-tile.selected{
  border-color:var(--gold);
  background:color-mix(
    in srgb,
    var(--gold) 14%,
    rgba(255,255,255,0.05)
  );
}

.food-tile:disabled{
  opacity:0.45;
}

/* confidence */

.confidence-bar-wrap{
  width:100%;
  height:8px;
  background:rgba(255,255,255,0.08);
  border-radius:100px;
  overflow:hidden;
  margin-top:6px;
}

.confidence-bar{
  height:100%;
  border-radius:100px;
  background:linear-gradient(
    90deg,
    var(--accent-2),
    var(--accent)
  );
  width:0%;
  transition:width 1.1s cubic-bezier(.2,.8,.2,1);
}

.confidence-num{
  font-family:var(--mono);
  font-size:13px;
  color:var(--ink-dim);
  margin-top:8px;
}

/* overthink bar */

.meter-wrap{
  width:100%;
  margin-top:10px;
  text-align:left;
}

.meter-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--ink-dim);
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}

.meter-track{
  width:100%;
  height:14px;
  background:rgba(255,255,255,0.08);
  border-radius:100px;
  overflow:hidden;
  position:relative;
}

.meter-fill{
  height:100%;
  border-radius:100px;
  width:0%;
  background:linear-gradient(
    90deg,
    #ff9f6b,
    #ff6bcb,
    #c44fd6
  );
  transition:width 1.6s cubic-bezier(.2,.9,.2,1);
}

/* height chase */

.chase-zone{
  position:relative;
  width:100%;
  height:min(50vh,380px);
  min-height:280px;
  border-radius:20px;
  border:1px dashed var(--line);
  overflow:hidden;
  margin-top:10px;
  background:rgba(255,255,255,0.03);
}

.chase-hint{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ink-dim);
  margin-top:14px;
}

/* arguments question */

.arg-btn{
  position:absolute;
  padding:15px 26px;
  border-radius:100px;
  border:none;
  font-weight:800;
  font-size:15px;
  color:#fff;
  user-select:none;
  -webkit-user-select:none;
  white-space:nowrap;
  cursor:pointer;
}

.arg-btn.arg-me{
  background:linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  box-shadow:0 10px 30px -8px color-mix(
    in srgb,
    var(--accent) 60%,
    transparent
  );
  transition:filter 0.15s ease, opacity 0.2s ease;
}

.arg-btn.arg-me:hover{
  filter:brightness(1.1);
}

.arg-btn.arg-me:active{
  filter:brightness(0.9);
}

.arg-btn.arg-me:disabled{
  opacity:0.6;
  pointer-events:none;
}

.arg-btn.arg-you{
  background:linear-gradient(
    135deg,
    #ff6b6b,
    #ff9f6b
  );
  box-shadow:0 10px 30px -8px rgba(255,107,107,0.5);
  transition:
    left 0.22s cubic-bezier(.2,.8,.2,1),
    top 0.22s cubic-bezier(.2,.8,.2,1);
  touch-action:none;
}

.arg-btn.arg-you:disabled{
  opacity:0.6;
  pointer-events:none;
}

/* transition / system status */

.status-table{
  width:100%;
  text-align:left;
  font-family:var(--mono);
  font-size:13.5px;
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.status-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dashed var(--line);
  padding-bottom:8px;
  opacity:0;
  animation:fadeup 0.5s ease forwards;
}

.status-row .val{
  color:var(--gold);
}

.status-row .val.ok{
  color:#7ee8a4;
}

.status-row .val.bad{
  color:#ff8a8a;
}

/* curtain scene */

.curtain-scene{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(
      ellipse at center,
      #1a1230,
      #060509 75%
    );
}

.curtain-obj{
  position:relative;
  width:min(78vw,520px);
  height:min(46vh,360px);
  border-radius:14px;
  background:linear-gradient(
    160deg,
    #241a3a,
    #120c20
  );
  box-shadow:
    0 30px 90px -30px rgba(0,0,0,0.8),
    inset 0 0 0 1px rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
}

.curtain-obj::after{
  content:'?';
  font-family:var(--serif);
  font-size:80px;
  color:rgba(255,255,255,0.18);
}

.curtain-panel{
  position:absolute;
  top:0;
  bottom:0;
  width:52%;
  background:
    repeating-linear-gradient(
      90deg,
      #2a0f22,
      #3a0f1c 3%,
      #2a0f22 6%
    );
  box-shadow:inset 0 0 60px rgba(0,0,0,0.5);
  touch-action:none;
  user-select:none;
  transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}

.curtain-panel.left{
  left:0;
  transform:translateX(0);
  border-top-right-radius:6px;
  border-bottom-right-radius:6px;
}

.curtain-panel.right{
  right:0;
  transform:translateX(0);
  border-top-left-radius:6px;
  border-bottom-left-radius:6px;
}

.curtain-panel .fold{
  position:absolute;
  top:0;
  bottom:0;
  width:8px;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,0.25),
    transparent
  );
}

.curtain-panel.left .fold{
  right:0;
}

.curtain-panel.right .fold{
  left:0;
}

.curtain-label{
  position:absolute;
  top:14%;
  left:0;
  right:0;
  text-align:center;
  z-index:6;
  pointer-events:none;
}

.curtain-label .headline{
  color:var(--ink);
}

.curtain-controls{
  position:absolute;
  bottom:8%;
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  z-index:6;
}

.drag-hint{
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ink-dim);
  display:flex;
  align-items:center;
  gap:6px;
}

/* reveal */

.reveal-scene{
  position:fixed;
  inset:0;
  z-index:35;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#revealCanvas{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

.reveal-content{
  position:relative;
  z-index:3;
  text-align:center;
  padding:24px;
  max-width:640px;
}

.reveal-title{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(32px,8vw,64px);
  color:var(--cream);
  text-shadow:
    0 0 40px rgba(255,183,201,0.5),
    0 0 80px rgba(244,192,77,0.25);
  margin:0 0 18px;
  opacity:0;
  transform:scale(0.92);
  cursor:default;
}

.reveal-title.show{
  animation:titlein 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes titlein{
  to{
    opacity:1;
    transform:scale(1);
  }
}

.reveal-msg{
  opacity:0;
  font-size:15.5px;
  line-height:1.8;
  color:rgba(255,240,230,0.9);
  white-space:pre-line;
}

.reveal-msg.show{
  animation:fadeup 1s ease 0.3s forwards;
}

.reveal-quip{
  opacity:0;
  font-family:var(--mono);
  font-size:12.5px;
  color:rgba(255,240,230,0.55);
  margin-bottom:16px;
}

.reveal-quip.show{
  animation:fadeup 0.8s ease forwards;
}

.reveal-controls{
  margin-top:30px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  opacity:0;
}

.reveal-controls.show{
  animation:fadeup 0.8s ease 0.6s forwards;
}

.pill-btn{
  padding:12px 22px;
  border-radius:100px;
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:13.5px;
  font-weight:600;
  backdrop-filter:blur(10px);
}

.pill-btn:hover{
  background:rgba(255,255,255,0.16);
}

.easter-btn{
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:6;
  font-family:var(--mono);
  font-size:10.5px;
  color:rgba(255,255,255,0.28);
  background:none;
  border:none;
  padding:8px;
}

.easter-btn:hover{
  color:rgba(255,255,255,0.55);
}

.easter-toast{
  position:fixed;
  bottom:60px;
  left:18px;
  z-index:7;
  font-family:var(--mono);
  font-size:12px;
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.15);
  padding:8px 14px;
  border-radius:10px;
  backdrop-filter:blur(8px);
  opacity:0;
  transform:translateY(6px);
  transition:all 0.3s;
}

.easter-toast.show{
  opacity:1;
  transform:translateY(0);
}

.balloon{
  position:absolute;
  bottom:-140px;
  border-radius:
    50% 50% 50% 50% /

function ensureAudio(){
  if(!audioCtx){
    try{
      audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){
      audioCtx = null;
    }
  }

  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function tone(freq, dur, type, gainVal, delay){
  if(!soundOn || !audioCtx) return;

  try{
    var t0 = audioCtx.currentTime + (delay || 0);

    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();

    osc.type = type || 'sine';

    osc.frequency.setValueAtTime(freq, t0);

    gain.gain.setValueAtTime(0, t0);

    gain.gain.linearRampToValueAtTime(
      gainVal || 0.06,
      t0 + 0.012
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      t0 + dur
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(t0);
    osc.stop(t0 + dur + 0.02);

  }catch(e){}
}

var SFX = {

  click:function(){
    tone(520,0.09,'sine',0.05);

  select:function(){

  beep:function(){

  warn:function(){

  whoosh:function(){

    try{

      var t0 = audioCtx.currentTime;

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();

      osc.type = 'sine';

      osc.frequency.setValueAtTime(120,t0);

      osc.frequency.exponentialRampToValueAtTime(
        900,
        t0 + 0.5
      );

      gain.gain.setValueAtTime(
        0.0001,
        t0
      );

      gain.gain.linearRampToValueAtTime(
        0.05,
        t0 + 0.08
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t0 + 0.55

  /*

  */

  tada:function(){

    if(!soundOn || !audioCtx) return;

    try{

      var t0 = audioCtx.currentTime;

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();

      osc.frequency.setValueAtTime(300, t0);

        t0 + 0.06
      );

      gain.gain.exponentialRampToValueAtTime(

      gain.connect(audioCtx.destination);

      osc.stop(t0 + 0.4);

      var chordDelay = 0.34;

  if(opts.html !== undefined){
    e.innerHTML = opts.html;

  if(opts.text !== undefined){
    e.textContent = opts.text;

  if(opts.attrs){
    for(var k in opts.attrs){

    }
  }

  return e;
}

/* ============================= THEME ============================= */

function setWarmth(w){

  var root = document.documentElement;

  function mix(hex1,hex2,t){

    var c1 = hexToRgb(hex1);
    var c2 = hexToRgb(hex2);

    var r = Math.round(
      c1.r + (c2.r-c1.r)*t
    );

    var g = Math.round(
      c1.g + (c2.g-c1.g)*t
    );

    var b = Math.round(
      c1.b + (c2.b-c1.b)*t
    );

    return 'rgb('+r+','+g+','+b+')';
  }

  function hexToRgb(h){

    h = h.replace('#','');

    return {
      r:parseInt(h.substring(0,2),16),
      g:parseInt(h.substring(2,4),16),
      b:parseInt(h.substring(4,6),16)
    };

  }

  root.style.setProperty(
    '--t-bg-0',
    mix('#07070d','#3a0f1c',w)
  );

  root.style.setProperty(
    '--t-bg-1',
    mix('#0d0c17','#5c1a2e',w)
  );

  root.style.setProperty(
    '--t-bg-2',
    mix('#151129','#7a2a3a',w)
  );

  root.style.setProperty(
    '--accent',
    mix('#8a63f2','#ff7aa2',w)
  );

  root.style.setProperty(
    '--accent-2',
    mix('#3b6fe0','#f4c04d',w)
  );

}

(function grain(){

  var c = document.getElementById('grain');
  var ctx = c.getContext('2d');

  function size(){

    c.width = window.innerWidth;
    c.height = window.innerHeight;

  }

  size();

  window.addEventListener('resize',size);

  function draw(){

    var w = c.width;
    var h = c.height;

    var id = ctx.createImageData(w,h);

    for(
      var i=0;
      i<id.data.length;
      i+=4
    ){

      var v = Math.random()*255;

      id.data[i] = v;
      id.data[i+1] = v;
      id.data[i+2] = v;
      id.data[i+3] = 14;

    }

    ctx.putImageData(id,0,0);

  }

  draw();

  if(!reduceMotion){
    setInterval(draw,140);
  }

})();

function renderArgument(){

  var wrap = el('div');

  wrap.innerHTML =

    '<div class="eyebrow">CONFLICT RESOLUTION MODULE</div>'+

    '<h1 class="headline">Who is responsible for<br/>all the arguments?</h1>'+

    '<p class="sub">Choose carefully. Only one answer is correct.</p>'+

    '<div class="card">'+

      '<div class="chase-zone" id="argZone">'+

        '<button id="argMeBtn" class="arg-btn arg-me">Me</button>'+

        '<button id="argYouBtn" class="arg-btn arg-you">You</button>'+

      '</div>'+

      '<div class="chase-hint" id="argHint">'+
        'Try tapping "You" if you dare.'+
      '</div>'+

      '<div class="system-log" id="argLog"></div>'+

      '<div id="argCtn"></div>'+

    '</div>';

  shell(wrap);

  var zone =
    $('#argZone');

  var youBtn =
    $('#argYouBtn');

  var meBtn =
    $('#argMeBtn');

  var hint =
    $('#argHint');

  var log =
    $('#argLog');

  var finished = false;

  var escapeCount = 0;

  /*
    Rotating funny labels the "You" button
    switches to every time it escapes.
  */

  var funnyLabels = [
    'NOPE 😂',
    'Nice try 😭',
    'Wrong answer 🤣',
    'Not me! 😌',
    'Think again 😂',
    'You wish 😭',
    'Absolutely not 🤨',
    'Caught you trying! 😂',
    'Try again 😭',
    'NO NO NOPE 🤣'
  ];

  /*
    The hint text below the buttons gets
    progressively funnier the longer the
    user keeps trying.
  */

  function hintForAttempt(n){

    if(n <= 1){
      return 'HAHA! You thought you could blame me? 😂';
    }

    if(n < 6){
      return 'Keep trying... 😭';
    }

    if(n < 12){
      return 'You are not going to catch this one. 🤣';
    }

    return 'Girl, just admit it already 🤣';

  }

  function placeMe(){

    /*
      "Me" stays put in a predictable, easily
      reachable spot inside the container.
    */

    meBtn.style.left = '24%';
    meBtn.style.top = '50%';
    meBtn.style.transform = 'translate(-50%,-50%)';

  }

  function distanceBetween(ax,ay,bx,by){

    var dx = ax-bx;
    var dy = ay-by;

    return Math.sqrt(dx*dx + dy*dy);

  }

  function placeYouRandom(){

    if(finished) return;

    var zr =
      zone.getBoundingClientRect();

    var bw =
      youBtn.offsetWidth || 110;

    var bh =
      youBtn.offsetHeight || 48;

    var padding = 16;

    var minX =
      padding + bw/2;

    var maxX =
      Math.max(
        minX,
        zr.width - padding - bw/2
      );

    var minY =
      padding + bh/2;

    var maxY =
      Math.max(
        minY,
        zr.height - padding - bh/2
      );

    var meRect =
      meBtn.getBoundingClientRect();

    var meX =
      (meRect.left - zr.left) + meRect.width/2;

    var meY =
      (meRect.top - zr.top) + meRect.height/2;

    var x, y, tries = 0;

    /*
      Try a few times to land somewhere that
      does not sit right on top of "Me".
    */

    do{

      x = rand(minX,maxX);
      y = rand(minY,maxY);

      tries++;

    } while(
      tries < 8 &&
      distanceBetween(x,y,meX,meY) < Math.max(bw,bh)*1.1
    );

    youBtn.style.left = x+'px';
    youBtn.style.top = y+'px';
    youBtn.style.transform = 'translate(-50%,-50%)';

  }

  function escapeYou(){

    if(finished) return;

    escapeCount++;

    placeYouRandom();

    youBtn.textContent =
      funnyLabels[(escapeCount-1) % funnyLabels.length];

    hint.textContent =
      hintForAttempt(escapeCount);

    if(escapeCount === 1){

      log.innerHTML =
        '<div class="line">"You" is refusing to cooperate...</div>';

    }

    SFX.beep();

  }

  /*
    Desktop: hovering over the button makes
    it run away. There is no timeout and no
    maximum number of escapes.
  */

  youBtn.addEventListener(
    'mouseenter',
    function(){

      if(!finished){
        escapeYou();
      }

    }
  );

  /*
    Desktop fallback: getting close to the
    button with the pointer also triggers it,
    so it feels like it is dodging you.
  */

  zone.addEventListener(
    'pointermove',
    function(e){

      if(finished) return;

      var br =
        youBtn.getBoundingClientRect();

      var distanceX =
        e.clientX -
        (br.left + br.width/2);

      var distanceY =
        e.clientY -
        (br.top + br.height/2);

      var distance =
        Math.sqrt(
          distanceX*distanceX +
          distanceY*distanceY
        );

      var triggerDistance =
        Math.max(
          55,
          Math.min(
            100,
            br.width * 0.85
          )
        );

      if(distance < triggerDistance){

        escapeYou();

      }

    }
  );

  /*
    Mobile: there is no hover, so pressing or
    tapping the button escapes it instead of
    selecting it. This works for touch and
    for mouse alike.
  */

  youBtn.addEventListener(
    'pointerdown',
    function(e){

      e.preventDefault();

      if(!finished){
        escapeYou();
      }

    }
  );

  youBtn.addEventListener(
    'click',
    function(e){

      e.preventDefault();

      if(!finished){
        escapeYou();
      }

    }
  );

  /*
    "Me" stays normal and clickable the
    entire time.
  */

  meBtn.addEventListener(
    'click',
    function(){

      if(finished) return;

      finished = true;

      ensureAudio();

      SFX.chime();

      youBtn.disabled = true;
      meBtn.disabled = true;

      meBtn.textContent =
        'Exactly 😌';

      hint.textContent =
        'CORRECT! 😂 You knew it all along.';

      log.innerHTML =
        '<div class="line">Blame successfully transferred. 😌</div>';

      setTimeout(
        function(){

          var btn =
            el(
              'button',
              {
                cls:'continue-btn',
                text:'Continue'
              }
            );

          btn.addEventListener(
            'click',
            function(){

              ensureAudio();
              SFX.click();
              advance();

            }
          );

          $('#argCtn')
            .appendChild(btn);

        },
        900
      );

    }
  );

  /*
    Initial placement, so "You" starts a safe
    distance away from "Me" before any
    interaction happens.
  */

  placeMe();

  youBtn.style.left = '74%';
  youBtn.style.top = '50%';
  youBtn.style.transform = 'translate(-50%,-50%)';

}

function renderCurtain(){

  var scene =
    el(
      'div',
      {
        cls:'curtain-scene'
      }
    );

  scene.innerHTML =

    '<div class="curtain-label">'+

      '<div class="eyebrow">FINAL ACCESS</div>'+

      '<h1 class="headline" style="font-size:clamp(22px,5vw,32px);">'+
        'Something is hiding behind here.'+
      '</h1>'+

      '<p class="sub" style="margin-bottom:0;">'+
        'You’ll have to open it yourself.'+
      '</p>'+

    '</div>'+

    '<div class="curtain-obj" id="curtainObj"></div>'+

    '<div class="curtain-panel left" id="cLeft">'+
      '<div class="fold"></div>'+
    '</div>'+

    '<div class="curtain-panel right" id="cRight">'+
      '<div class="fold"></div>'+
    '</div>'+

    '<div class="curtain-controls">'+

      '<div class="drag-hint">'+
        '← Drag the curtains open →'+
      '</div>'+

      '<button class="continue-btn" id="openBtn" style="animation-delay:0.2s;">'+
        'Open the curtain'+
      '</button>'+

    '</div>';

  app.innerHTML = '';

  app.appendChild(scene);

  var left =
    $('#cLeft');

  var right =
    $('#cRight');

  var opened = false;

  var dragState = null;

  function setPanelPct(
    panel,
    pct,
    side
  ){

    var tx =
      pct * 105;

    panel.style.transform =
      'translateX('+
      (side==='left'
        ? -tx
        : tx)+
      '%)';

  }

  function attachDrag(
    panel,
    side
  ){

    panel.addEventListener(
      'pointerdown',
      function(e){

        if(opened) return;

        panel.setPointerCapture(
          e.pointerId
        );

        dragState = {
          side:side,
          startX:e.clientX,
          panel:panel
        };

        panel.style.transition =
          'none';

        ensureAudio();

      }
    );

    panel.addEventListener(
      'pointermove',
      function(e){

        if(
          !dragState ||
          dragState.panel !== panel ||
          opened
        ){
          return;
        }

        var dx =
          e.clientX -
          dragState.startX;

        var w =
          panel.getBoundingClientRect()
            .width;

        var raw =
          side === 'left'
          ? Math.max(0,-dx)
          : Math.max(0,dx);

        var pct =
          clamp(raw/w,0,1);

        setPanelPct(
          panel,
          pct,
          side
        );

      }
    );

    function endDrag(e){

      if(
        !dragState ||
        dragState.panel !== panel
      ){
        return;
      }

      panel.style.transition =
        '';

      var dx =
        e.clientX -
        dragState.startX;

      var w =
        panel.getBoundingClientRect()
          .width;

      var raw =
        side === 'left'
        ? Math.max(0,-dx)
        : Math.max(0,dx);

      var pct =
        clamp(raw/w,0,1);

      dragState = null;

      if(pct > 0.35){

        openReveal();

      }else{

        setPanelPct(
          panel,
          0,
          side
        );

      }

    }

    panel.addEventListener(
      'pointerup',
      endDrag
    );

    panel.addEventListener(
      'pointercancel',
      endDrag
    );

  }

  attachDrag(left,'left');
  attachDrag(right,'right');

  $('#openBtn').addEventListener(
    'click',
    function(){

      ensureAudio();
      openReveal();

    }
  );

  function openReveal(){

    if(opened) return;

    opened = true;

    SFX.curtain();

    left.style.transition =
      'transform 0.7s cubic-bezier(.2,.7,.2,1)';

    right.style.transition =
      'transform 0.7s cubic-bezier(.2,.7,.2,1)';

    setPanelPct(
      left,
      1,
      'left'
    );

    setPanelPct(
      right,
      1,
      'right'
    );

    setTimeout(
      function(){
        advance();
      },
      650
    );

  }

}

        '@keyframes balloonRise{'+
          '0%{transform:translateY(0) rotate(0deg);opacity:0.95}'+
          '100%{transform:translateY(-115vh) rotate(8deg);opacity:0}'+
        '}'+

        '@keyframes heartRise{'+
          '0%{transform:translateY(0) scale(0.8);opacity:0}'+
          '10%{opacity:0.9}'+
          '100%{transform:translateY(-90vh) scale(1.1);opacity:0}'+
        '}';

      document.head.appendChild(st);

    }

  }

  function spawnHearts(){

    if(reduceMotion) return;

    var count =
      window.innerWidth < 480
      ? 6
      : 10;

    for(
      var i=0;
      i<count;
      i++
    ){

      (function(){

        var h =
          el(
            'div',
            {
              cls:'heart-float',
              text:
                Math.random()>0.5
                ? '❤️'
                : '✨'
            }
          );

        h.style.left =
          rand(4,96)+'%';

        h.style.animation =
          'heartRise '+
          rand(5,8)+
          's ease-in '+
          rand(0.5,3)+
          's forwards';

        scene.appendChild(h);

        setTimeout(
          function(){
            h.remove();
          },
          11000
        );

      })();

    }

  }

  /* confetti canvas */

  var canvas =
    $('#revealCanvas');

  var ctx =
    canvas.getContext('2d');

  function fit(){

    canvas.width =
      window.innerWidth;

    canvas.height =
      window.innerHeight;

  }

  fit();

  window.addEventListener(
    'resize',
    fit
  );

  var particles = [];

  function burstConfetti(){

    if(reduceMotion) return;

    var colors = [
      '#ff7aa2',
      '#f4c04d',
      '#ffb6c9',
      '#c44fd6',
      '#ff9f6b',
      '#fff4e0'
    ];

    var n =
      window.innerWidth < 480
      ? 70
      : 130;

    for(
      var i=0;
      i<n;
      i++
    ){

      particles.push({

        x:
          canvas.width/2 +
          rand(-60,60),

        y:
          canvas.height*0.32 +
          rand(-20,20),

        vx:
          rand(-6,6),

        vy:
          rand(-9,-2),

        g:
          rand(0.15,0.28),

        size:
          rand(4,9),

        rot:
          rand(0,360),

        vr:
          rand(-8,8),

        color:
          colors[
            Math.floor(
              Math.random()*
              colors.length
            )
          ],

        life:
          rand(90,150)

      });

    }

  }

  var animId = null;

  function loop(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    for(
      var i=particles.length-1;
      i>=0;
      i--
    ){

      var p =
        particles[i];

      p.x += p.vx;

      p.y += p.vy;

      p.vy += p.g;

      p.rot += p.vr;

      p.life--;

      if(
        p.life<=0 ||
        p.y > canvas.height+40
      ){

        particles.splice(i,1);

        continue;

      }

      ctx.save();

      ctx.translate(
        p.x,
        p.y
      );

      ctx.rotate(
        p.rot*Math.PI/180
      );

      ctx.fillStyle =
        p.color;

      ctx.globalAlpha =
        clamp(
          p.life/40,
          0,
          1
        );

      ctx.fillRect(
        -p.size/2,
        -p.size/2,
        p.size,
        p.size*0.6
      );

      ctx.restore();

    }

    animId =
      requestAnimationFrame(loop);

  }

  loop();

}

/* ============================= INIT ============================= */

goTo(0);

})();
</script>
